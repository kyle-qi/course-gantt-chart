<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Course Timeline</title>
  <link rel="icon" href="build/icon.png" type="image/png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-chrome">
    <div class="window-titlebar window-drag" aria-hidden="true">
      <span class="window-titlebar-label">Course Timeline</span>
    </div>
    <header class="app-header">
      <div class="header-actions">
        <button type="button" id="btn-export-json" class="btn secondary">Export JSON</button>
        <button type="button" id="btn-export-csv" class="btn secondary">Export CSV</button>
        <button type="button" id="btn-import-json" class="btn secondary">Import JSON</button>
        <button type="button" id="btn-import-csv" class="btn secondary">Import CSV</button>
        <input type="file" id="import-file-json" accept="application/json,.json" hidden />
        <input type="file" id="import-file-csv" accept="text/csv,.csv" hidden />
      </div>
    </header>
  </div>

  <main>
    <div class="timeline-toolbar">
      <div class="toolbar-row toolbar-row-controls">
        <div class="toolbar-controls">
          <div class="toolbar-group toolbar-color">
            <span class="toolbar-label">Color by</span>
            <select id="timeline-color">
              <option value="course">Course</option>
              <option value="type">Type</option>
            </select>
          </div>
          <div class="toolbar-group toolbar-zoom">
            <span class="toolbar-label">Zoom</span>
            <input type="range" id="timeline-zoom" min="8" max="56" value="20" step="1" />
          </div>
        </div>
        <span id="storage-hint" class="hint toolbar-hint"></span>
      </div>

      <div class="toolbar-row toolbar-row-courses">
        <span class="toolbar-label">Courses</span>
        <div id="course-filter-list" class="course-filter-list" role="group" aria-label="Course visibility"></div>
      </div>

      <div class="toolbar-row toolbar-row-legend">
        <span class="toolbar-label">Legend</span>
        <div id="timeline-legend" class="legend legend-inline"></div>
      </div>
    </div>

    <div class="timeline-panel">
      <div class="timeline-container">
        <div class="timeline-viewport" title="Drag to scroll the timeline">
          <div id="timeline-scroll" class="timeline-scroll"></div>
        </div>
      </div>
    </div>
    <div id="bar-tooltip" class="bar-tooltip" hidden></div>

    <section class="editor-section">
      <div class="editor-header">
        <h2>Deliverables</h2>
        <button type="button" id="btn-add-row" class="btn primary">Add deliverable</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th scope="col" class="th-sortable" data-sort-field="course">
                <button type="button" class="th-sort-btn">Course</button>
              </th>
              <th scope="col" class="th-sortable" data-sort-field="type">
                <button type="button" class="th-sort-btn">Type</button>
              </th>
              <th scope="col" class="th-sortable" data-sort-field="task">
                <button type="button" class="th-sort-btn">Task</button>
              </th>
              <th scope="col" class="th-sortable" data-sort-field="startDate">
                <button type="button" class="th-sort-btn">Start</button>
              </th>
              <th scope="col" class="th-sortable" data-sort-field="endDate">
                <button type="button" class="th-sort-btn">End</button>
              </th>
              <th scope="col" class="th-sortable" data-sort-field="weight">
                <button type="button" class="th-sort-btn">Weight (%)</button>
              </th>
              <th scope="col" class="col-actions" aria-label="Actions"></th>
            </tr>
          </thead>
          <tbody id="editor-body"></tbody>
        </table>
      </div>
      <p class="hint editor-hint" id="editor-hint">If no start date is set, the bar begins 10 days before the due date. Changes save automatically.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
